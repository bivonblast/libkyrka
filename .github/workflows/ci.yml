# Build, test, package and publish LibKyrka.Net.
#
#   native      - build libkyrka for every supported platform
#   test        - run the test suite and the demo on every platform
#   performance - run the benchmarks and fail if performance regressed
#                 against benchmarks/baseline (see benchmarks/README.md)
#   pack        - create the NuGet package (only after both of the above)
#   publish     - push to nuget.org (only for v* tags, only after pack)
#
# To release: push a tag such as v1.2.3. The package version is taken
# from the tag. Publishing uses nuget.org trusted publishing, so there is
# no API key to leak; see "Releasing" in README.md for the one-time setup.
#
# Third-party actions are pinned to full commit SHAs, so a moved or
# compromised tag cannot change what runs here. Dependabot keeps them
# up to date (.github/dependabot.yml).

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
# Tag runs are never cancelled, so a release always completes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  native:
    name: Native (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: ubuntu-latest, script: native/build-docker.sh }
          - { rid: linux-x64, os: ubuntu-latest, script: native/build-docker.sh }
          - { rid: linux-arm64, os: ubuntu-latest, script: native/build-docker.sh }
          - { rid: osx-arm64, os: macos-latest, script: native/build.sh }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # The binary only changes when the libkyrka commit or the build
      # scripts change, so it is cached on exactly those inputs. Releases
      # never use the cache: the binaries that are published are always
      # built from source in the release run itself.
      - name: Compute cache key
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        id: key
        shell: bash
        run: echo "value=native-${{ matrix.rid }}-$(git rev-parse HEAD:native/libkyrka)-${{ hashFiles('native/*.sh', 'native/Dockerfile') }}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        id: cache
        with:
          path: native/out/${{ matrix.rid }}
          key: ${{ steps.key.outputs.value }}

      - name: Build libkyrka
        if: steps.cache.outputs.cache-hit != 'true'
        run: sh ${{ matrix.script }} ${{ matrix.rid }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.rid }}
          path: native/out
          if-no-files-found: error

  test:
    name: Test (${{ matrix.rid }})
    needs: native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-arm64, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: native/out
          merge-multiple: true

      # The SDK from global.json, plus .NET 10 so the net10.0 tests run on
      # the real .NET 10 runtime.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Demo smoke test
        run: dotnet run --project samples/LibKyrka.Demo -c Release --no-build -- loopback --count 3

  # Linux x64 only: one platform is enough to notice a regression in the
  # wrapper, and the hosted Linux runners are the most consistent.
  performance:
    name: Performance gate
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-linux-x64
          path: native/out

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Fails when performance regressed; the comparison table is shown
      # on the run's summary page.
      - name: Compare with the baseline
        run: dotnet run -c Release --project benchmarks/LibKyrka.Benchmarks -- check

      # Includes linux-x64.json: these results as a ready-to-commit
      # baseline, for when a slowdown is intended.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-results
          path: artifacts/benchmarks
          if-no-files-found: ignore

  pack:
    name: Pack
    needs: [test, performance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: native/out
          merge-multiple: true

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.1.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        run: dotnet pack src/LibKyrka -c Release -o artifacts/packages -p:Version=${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: error

  publish:
    name: Publish to nuget.org
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget
    # Only this job may request an OIDC token: for trusted publishing and
    # for signing the provenance attestation.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts/packages

      # A signed record of which commit and workflow run built the package.
      # Verify with: gh attestation verify <file.nupkg> --repo <owner/repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/packages/*.nupkg

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'

      # Trusted publishing: exchanges this run's OIDC token for an API key
      # that is valid for one hour. NUGET_USER is a repository variable
      # holding the nuget.org account name (not a secret).
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}

      # The .snupkg symbol package is pushed together with the .nupkg.
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
